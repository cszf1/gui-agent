name: desktop app
on:
  push:
    paths: ['desktop/**', 'gua/**', 'configs/**', 'tasks/**', 'pyproject.toml', '.github/workflows/desktop.yml']
  pull_request:
    paths: ['desktop/**', 'gua/**', 'configs/**', 'tasks/**', 'pyproject.toml', '.github/workflows/desktop.yml']
  workflow_dispatch:
jobs:
  desktop-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24', cache: npm, cache-dependency-path: desktop/package-lock.json}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -e ".[web,dev]"
      - run: python -m playwright install --with-deps chromium
      - run: npm ci
        working-directory: desktop
      - run: npm run build && npm test
        working-directory: desktop
      - run: xvfb-run -a npm run test:e2e
        working-directory: desktop
      - uses: actions/upload-artifact@v4
        if: failure()
        with: {name: desktop-test-results, path: desktop/test-results/}
  windows-installer:
    if: github.event_name != 'pull_request'
    needs: desktop-tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24', cache: npm, cache-dependency-path: desktop/package-lock.json}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -e ".[windows,web]" pyinstaller
      - run: npm ci
        working-directory: desktop
      - run: python scripts/smoke-windows-native.py
        working-directory: desktop
      - run: npm run worker:build
        working-directory: desktop
      - run: python scripts/smoke-worker.py
        working-directory: desktop
      - run: npm run dist:win
        working-directory: desktop
        env: {CSC_IDENTITY_AUTO_DISCOVERY: 'false'}
      - uses: actions/upload-artifact@v4
        with:
          name: GUI-Agent-Windows-Installer
          path: desktop/release/*-Setup.exe
          if-no-files-found: error
