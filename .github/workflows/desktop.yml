name: desktop app
on:
  push:
    paths: ['desktop/**', 'gua/**', 'configs/**', 'tasks/**', 'pyproject.toml', 'scripts/install-playwright-ci.sh', '.github/workflows/desktop.yml']
  pull_request:
    paths: ['desktop/**', 'gua/**', 'configs/**', 'tasks/**', 'pyproject.toml', 'scripts/install-playwright-ci.sh', '.github/workflows/desktop.yml']
  workflow_dispatch:
jobs:
  desktop-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24', cache: npm, cache-dependency-path: desktop/package-lock.json}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -e ".[web,dev]"
      - name: Install Chromium and system dependencies
        run: bash scripts/install-playwright-ci.sh
        timeout-minutes: 10
      - run: npm ci
        working-directory: desktop
      - run: npm run build && npm test
        working-directory: desktop
      - run: xvfb-run -a npm run test:e2e
        working-directory: desktop
      - uses: actions/upload-artifact@v4
        if: failure()
        with: {name: desktop-test-results, path: desktop/test-results/}
  windows-installer:
    if: github.event_name != 'pull_request'
    needs: desktop-tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24', cache: npm, cache-dependency-path: desktop/package-lock.json}
      - uses: actions/setup-python@v5
        with: {python-version: '3.13.9'}
      - run: pip install -e ".[windows,web]"
      - run: choco install nsis -y --no-progress
      - run: npm ci
        working-directory: desktop
      - run: npm run build
        working-directory: desktop
      - run: npm run dist:win
        working-directory: desktop
      - name: Real UIA with embedded Python
        run: '& .\release\GUI-Agent\runtime\python.exe -B scripts/smoke-windows-native.py'
        working-directory: desktop
      - name: Install, system Edge UI, run, upgrade and clean uninstall
        run: python scripts/smoke-windows-installer.py
        working-directory: desktop
      - uses: actions/upload-artifact@v4
        with:
          name: GUI-Agent-Windows-Installer
          path: |
            desktop/release/*-Setup.exe
            desktop/release/build-manifest.json
          if-no-files-found: error
