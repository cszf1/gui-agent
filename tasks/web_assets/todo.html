<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Todo list</title>
<style>body{font-family:sans-serif;margin:40px;font-size:16px}input[type=text]{width:300px;padding:6px;font-size:16px}
button{padding:6px 16px;font-size:16px}li{margin:8px 0;list-style:none}.done span{text-decoration:line-through;color:#888}</style></head><body>
<h1>Todo list</h1>
<input id="new" type="text" placeholder="New todo" onkeydown="if(event.key==='Enter')add()"> <button onclick="add()">Add</button>
<ul id="list"></ul><div id="count">0 items, 0 done</div>
<script>
function render(){ const items=[...document.querySelectorAll('#list li')];
  document.getElementById('count').innerText=`${items.length} items, ${items.filter(l=>l.classList.contains('done')).length} done`; }
function add(){ const v=document.getElementById('new').value.trim(); if(!v) return;
  const li=document.createElement('li'); const id='t'+Date.now();
  li.innerHTML=`<label><input type="checkbox" aria-label="Done: ${v}"> <span>${v}</span></label>`;
  li.querySelector('input').onchange=e=>{li.classList.toggle('done',e.target.checked);render();};
  document.getElementById('list').appendChild(li); document.getElementById('new').value=''; render(); }
</script></body></html>
