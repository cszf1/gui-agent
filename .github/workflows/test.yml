name: tests
on: [push, pull_request]
jobs:
  core:
    # mock 平台 + fixture 解析 + 模型后端离线测试：三大 OS 都跑（web 集成测试在没有 playwright 时自动跳过）
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "${{ matrix.python }}"}
      - run: pip install -e ".[dev]"
      # 与审查者的 Windows 环境一致：不写字节码、不用 pytest 缓存；web 测试在没有 playwright 时整模块跳过
      - run: python -B -m pytest -q -p no:cacheprovider -m "not web"
  web:
    # 真实 Chromium 上的端到端集成测试（脚本策略，无需 API key）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -e ".[dev,web]"
      - name: Install Chromium and system dependencies
        run: bash scripts/install-playwright-ci.sh
        timeout-minutes: 10
      - run: pytest -q
      - run: gua demo --runs runs
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: web-demo-runs, path: runs/}
