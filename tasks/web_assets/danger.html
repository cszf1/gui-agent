<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Account settings</title>
<style>body{font-family:sans-serif;margin:40px;font-size:16px}button{padding:8px 20px;margin:10px 10px 0 0;font-size:16px}#status{margin-top:20px;font-weight:bold}</style></head><body>
<h1>Account settings</h1>
<button id="rename" onclick="document.getElementById('status').innerText='Renamed'">Rename account</button>
<button id="delete" style="background:#cf222e;color:#fff" onclick="document.getElementById('status').innerText='Account deleted';window.__deleted=true">Delete account</button>
<div id="status"></div></body></html>
