# Claude 作为普通多模态模型（输出 JSON 动作，走我们的 a11y/VLM grounder）
models:
  planner: {provider: anthropic, model: claude-sonnet-4-5, api_key_env: ANTHROPIC_API_KEY, max_tokens: 1024}
