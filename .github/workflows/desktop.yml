name: desktop app
on:
  push:
    paths: ['desktop/**', 'gua/**', 'configs/**', 'tasks/**', 'tests/**', 'pyproject.toml', 'scripts/install-playwright-ci.sh', '.github/workflows/desktop.yml']
  pull_request:
    paths: ['desktop/**', 'gua/**', 'configs/**', 'tasks/**', 'tests/**', 'pyproject.toml', 'scripts/install-playwright-ci.sh', '.github/workflows/desktop.yml']
  workflow_dispatch:
jobs:
  desktop-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24', cache: npm, cache-dependency-path: desktop/package-lock.json}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -e ".[web,dev]"
      - run: python -B -m pytest -p no:cacheprovider -q tests/test_slim_packaging.py tests/test_fast_precision.py
      - name: Install Chromium and system dependencies
        run: bash scripts/install-playwright-ci.sh
        timeout-minutes: 10
      - run: npm ci
        working-directory: desktop
      - run: npm run build && npm test
        working-directory: desktop
      - run: xvfb-run -a npm run test:e2e
        working-directory: desktop
      - uses: actions/upload-artifact@v4
        if: failure()
        with: {name: desktop-test-results, path: desktop/test-results/}
  windows-installer:
    if: github.event_name != 'pull_request'
    needs: desktop-tests
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24', cache: npm, cache-dependency-path: desktop/package-lock.json}
      - uses: actions/setup-python@v5
        with: {python-version: '3.13.9'}
      - run: pip install -e ".[windows,web]"
      - run: choco install nsis -y --no-progress
      - run: npm ci
        working-directory: desktop
      - run: npm run build
        working-directory: desktop
      - run: npm run dist:win
        working-directory: desktop
      - name: Real Edge UI with incorrect system MIME mappings and embedded Python
        working-directory: desktop
        run: |
          $env:GUI_AGENT_PYTHON = (Resolve-Path release/GUI-Agent/runtime/python.exe).Path
          npm run test:e2e
          if ($LASTEXITCODE -ne 0) { throw "Embedded Edge UI MIME regression failed" }
      - name: Real UIA with embedded Python
        run: '& .\release\GUI-Agent\runtime\python.exe -B scripts/smoke-windows-native.py'
        working-directory: desktop
      - name: Install, system Edge UI, run, upgrade and clean uninstall
        run: python scripts/smoke-windows-installer.py
        working-directory: desktop
      - name: Portable launcher, real Edge UI, embedded task and encrypted restart
        run: python scripts/smoke-windows-portable.py
        working-directory: desktop
      - uses: actions/upload-artifact@v4
        with:
          name: GUI-Agent-Windows-Installer
          path: |
            desktop/release/*-Setup.exe
            desktop/release/*-Portable.zip
            desktop/release/build-manifest.json
          if-no-files-found: error
      - name: Prepare a draft release after Windows verification
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        working-directory: desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $tag = "v$version"
          gh release view $tag --json url 2>$null
          if ($LASTEXITCODE -ne 0) {
            $setup = (Get-ChildItem release/*-Setup.exe).FullName
            $portable = (Get-ChildItem release/*-Portable.zip).FullName
            gh release create $tag $setup $portable release/build-manifest.json --target "${{ github.sha }}" --draft --title "GUI Agent $version" --notes-file "../docs/releases/$tag.md"
            if ($LASTEXITCODE -ne 0) { throw "Draft release upload failed" }
          }
